<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020617">
  <title>Male Cyber Fighters — Offline</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #e2e8f0;
      background: #020617;
      font: 16px/1.5 system-ui, -apple-system, sans-serif;
      text-align: center;
    }
    main { max-width: 420px; }
    img { width: 84px; height: 84px; border-radius: 16px; margin-bottom: 18px; }
    h1 { margin: 0 0 10px; font-size: 1.6rem; }
    p { color: #94a3b8; }
    button {
      margin-top: 12px;
      padding: 12px 18px;
      border: 0;
      border-radius: 8px;
      color: #00121f;
      background: linear-gradient(135deg, #7fd8ff, #b0c4ff);
      font: inherit;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <img src="/images/mcf.png" alt="Male Cyber Fighters">
    <h1>The arena is temporarily offline</h1>
    <p>Reconnect to return to the live arena, rooms and direct messages.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
