<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Reset Password • Male Cyber Fighters</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="/css/desktop.css">
<link rel="stylesheet" href="/css/reset-password.css">
</head>
<body class="reset-page">

<div class="reset-card">
  <img src="./images/mcf.png" alt="Male Cyber Fighters" class="reset-logo">
  <h1>Choose a New Password</h1>

  <div id="resetIntro">
    <p class="forgot-help">Enter a new password for your account. Passwords must be at least 8 characters long.</p>

    <label class="reset-label" for="resetPass">New password</label>
    <input id="resetPass" type="password" autocomplete="new-password" placeholder="New password">

    <label class="reset-label" for="resetPass2">Confirm new password</label>
    <input id="resetPass2" type="password" autocomplete="new-password" placeholder="Repeat new password">

    <div id="resetError" style="display:none"></div>
    <div id="resetSuccess" style="display:none"></div>

    <div class="forgot-actions">
      <a class="ghost-link" href="/">Back to site</a>
      <button id="resetSubmit" type="button">Update Password</button>
    </div>
  </div>
</div>

<script src="/js/reset-password.js"></script>
</body>
</html>
