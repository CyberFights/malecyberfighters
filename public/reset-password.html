<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Male Cyber Fighters</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #020617;
    color: #e9f6ff;
    font-family: Inter, system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .card {
    width: 360px;
    max-width: 92vw;
    padding: 28px;
    background: #0b1120;
    border: 1px solid #1e293b;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p.sub { color: #93a4b8; font-size: 14px; margin: 0 0 18px; }
  label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 6px; }
  input {
    width: 100%;
    padding: 12px;
    margin-bottom: 14px;
    background: #060b16;
    border: 1px solid #1e293b;
    border-radius: 8px;
    color: #e9f6ff;
    font-size: 15px;
  }
  input:focus { outline: none; border-color: #38bdf8; }
  button {
    width: 100%;
    padding: 12px;
    background: linear-gradient(135deg, #7fd8ff, #b0c4ff);
    color: #00121f;
    font-weight: 700;
    font-size: 15px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.05); }
  .msg { font-size: 13px; margin: 0 0 10px; display: none; }
  .msg.error { color: #f87171; }
  .msg.success { color: #4ade80; }
  .backlink { display: block; margin-top: 14px; text-align: center; color: #6cf; font-size: 13px; text-decoration: none; }
</style>
</head>
<body>
  <div class="card">
    <h1>Choose a new password</h1>
    <p class="sub">Enter a new password for your Male Cyber Fighters account.</p>

    <div id="status" class="msg"></div>

    <form id="resetForm">
      <label for="newPass">New password</label>
      <input id="newPass" type="password" placeholder="At least 6 characters" autocomplete="new-password">

      <label for="newPass2">Confirm password</label>
      <input id="newPass2" type="password" placeholder="Repeat password" autocomplete="new-password">

      <button id="submitBtn" type="submit">Reset password</button>
    </form>

    <a class="backlink" href="/">Back to Male Cyber Fighters</a>
  </div>

  <script src="/js/reset-password.js"></script>
</body>
</html>
